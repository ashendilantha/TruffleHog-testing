name: TruffleHog Scan

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    trufflehog:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Run Trufflehog
              uses: trufflesecurity/trufflehog@main
              with: 
                path: ./
                base: ${{ github.event.repository.default_branch }}
                head: HEAD
                extra_args: --only-verified --fail